version: "3.9"

services:

  # Application principale RAG vs KAG
  app:
    build: .
    container_name: ooredoo-ai-lab
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./milvus_rag.db:/app/milvus_rag.db
      - ./mlruns:/app/mlruns
    restart: unless-stopped
    networks:
      - ai-network

  # Neo4j — Graphe de connaissances KAG
  neo4j:
    image: neo4j:5.13-community
    container_name: neo4j-kag
    ports:
      - "7474:7474"   # Interface web Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ai-network

  # MLflow — Tracking des expérimentations
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: mlflow-tracking
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
    volumes:
      - mlflow_data:/mlflow
    networks:
      - ai-network

volumes:
  neo4j_data:
  neo4j_logs:
  mlflow_data:

networks:
  ai-network:
    driver: bridge
